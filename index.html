<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vila Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">💬</div><div><h1>Vila Chat</h1><span id="onlineCount">Conectando...</span></div></div>
  <div class="user-area"><span id="currentName">Anônimo</span><button id="changeNameBtn">Mudar nome</button></div>
</header>
<main id="messages" class="messages"><div class="welcome"><h2>Bem-vindo ao Vila Chat! 👋</h2><p>Escolha seu nome e comece a conversar.</p></div></main>
<div id="emojiPanel" class="emoji-panel" hidden>
<button>😀</button><button>😂</button><button>🤣</button><button>😍</button><button>😎</button><button>😭</button><button>😡</button><button>👍</button><button>❤️</button><button>🔥</button><button>🎉</button><button>💀</button>
</div>
<form id="messageForm" class="composer">
<button type="button" id="emojiBtn" class="icon-btn">😊</button>
<input id="messageInput" maxlength="1000" autocomplete="off" placeholder="Escreva uma mensagem..." required>
<span id="counter">0/1000</span>
<button type="submit" class="send-btn">Enviar</button>
</form>
</div>
<dialog id="nameDialog"><form method="dialog" id="nameForm"><h2>Seu nome</h2><p>Escolha como você aparecerá no chat.</p><input id="nameInput" maxlength="20" placeholder="Seu nome" required><div class="dialog-actions"><button value="cancel">Cancelar</button><button value="save" class="save">Salvar</button></div></form></dialog>
<script type="module" src="script.js"></script>
</body>
</html>
